name: Tests and coverage

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest --cov --cov-config=.coveragerc --cov-report=term-missing

  installers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: |
          bash install-ubuntu.sh
          .venv/bin/python -m pip check
          .venv/bin/python -c "import src.server"
      - if: runner.os == 'Windows'
        shell: cmd
        run: |
          call install-windows.cmd || exit /b 1
          .venv\Scripts\python.exe -m pip check || exit /b 1
          .venv\Scripts\python.exe -c "import src.server"
